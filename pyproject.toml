[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-work-mail-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Tencent Exmail and WeChat Work Mail."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
wechat-work-mail-mcp = "wechat_work_mail.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_work_mail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
